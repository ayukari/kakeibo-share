# XcodeGen の設定（Mac で `xcodegen generate` → Kakeibo.xcodeproj ができる）。docs/setup-ios.md
name: Kakeibo
options:
  bundleIdPrefix: jp.kakeibo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kakeibo:
    type: application
    platform: iOS
    sources: [Kakeibo]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Kakeibo/Info.plist
      properties:
        CFBundleDisplayName: 共有家計簿
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kakeibo.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Supabase
        product: Supabase
  KakeiboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KakeiboTests
      - path: ../tests/vectors
        buildPhase: resources
    dependencies:
      - target: Kakeibo
  KakeiboUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KakeiboUITests]
    dependencies:
      - target: Kakeibo
schemes:
  Kakeibo:
    build:
      targets:
        Kakeibo: all
    test:
      targets: [KakeiboTests, KakeiboUITests]
