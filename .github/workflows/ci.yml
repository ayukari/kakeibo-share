# 3 つを別々にビルド・テストする（DB / Android / iOS）。iOS はクラウドの Mac（GitHub の macOS ランナー）で動かす
# 公開リポジトリなら無料。非公開リポジトリは無料枠の分数に macOS は 10 倍で数えられる（docs/cost-and-limits.md）
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL を起動（ランナーに入っているもの）
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          chmod -R o+rX "$GITHUB_WORKSPACE" "$(dirname "$GITHUB_WORKSPACE")" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" || true
      - name: マイグレーションと DB のテスト
        env: { PSQL_BIN: psql, PGPORT: "5432", PGPASSWORD: postgres }
        run: bash supabase/tests/run.sh

  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: テスト・lint・ビルド
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-reports, path: android/app/build/reports }

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: プロジェクトを作る
        run: |
          brew install xcodegen
          xcodegen generate
      - name: テスト（シミュレーター）
        run: |
          set -o pipefail
          xcodebuild test -project Kakeibo.xcodeproj -scheme Kakeibo -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO | tail -200
