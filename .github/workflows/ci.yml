# 3 つを別々にビルド・テストする（DB / Android / iOS）。iOS はクラウドの Mac（GitHub の macOS ランナー）で動かす
# 公開リポジトリなら無料。非公開リポジトリは無料枠の分数に macOS は 10 倍で数えられる（docs/cost-and-limits.md）
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL を起動（ランナーに入っているもの）
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          mkdir -p /tmp/kbroot/tests && cp -r tests/vectors /tmp/kbroot/tests/ && chmod -R a+rX /tmp/kbroot
      - name: マイグレーションと DB のテスト
        env: { PSQL_BIN: psql, PGPORT: "5432", PGPASSWORD: postgres, KB_ROOT: /tmp/kbroot }
        run: bash supabase/tests/run.sh

  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: テスト・lint・ビルド
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :physicspreview:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/shots

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: プロジェクトを作る
        run: |
          brew install xcodegen
          xcodegen generate
      - name: テスト（シミュレーター）
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "シミュレーター: $DEST"
          xcodebuild test -project Kakeibo.xcodeproj -scheme Kakeibo -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|Test Suite|Executed|TEST (SUCCEEDED|FAILED)" build.log | sort -u | head -80
          exit ${status:-0}
